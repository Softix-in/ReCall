<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <img class="brand-logo" src="../icons/logo.svg" width="24" height="24" alt="" />
          <span>Recall</span>
        </div>
        <a class="search-link" id="open-search" href="#">Open search</a>
      </header>

      <nav class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="capture" role="tab">Capture</button>
        <button class="tab-btn" data-tab="vault" role="tab">Link Vault</button>
        <button class="tab-btn" data-tab="recent" role="tab">Recent</button>
      </nav>

      <section class="panel active" id="panel-capture" role="tabpanel">
        <div class="page-card" id="capture-card">
          <div class="thumb placeholder" id="capture-thumb">📄</div>
          <div class="page-meta">
            <h2 id="capture-title">Loading page…</h2>
            <p id="capture-domain"></p>
            <span class="status-pill" id="capture-status" hidden></span>
          </div>
        </div>

        <div class="failed-jobs" id="failed-jobs" hidden>
          <h3 class="section-title">Failed saves</h3>
          <div id="failed-list"></div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="quick-save-btn">Quick save</button>

          <label class="note-toggle">
            <input type="checkbox" id="note-toggle" />
            Add a note
          </label>

          <div class="note-area" id="note-area">
            <textarea id="capture-note" placeholder="What should you remember about this page?"></textarea>
            <button class="btn btn-secondary" id="save-note-btn">Save with note</button>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-vault" role="tabpanel">
        <div class="url-row">
          <input type="url" id="vault-url" placeholder="Paste any URL…" />
          <button class="inline-btn" id="paste-url-btn" title="Paste from clipboard">Paste</button>
        </div>

        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="auto_scrape" type="button">Auto-scrape</button>
          <button class="mode-btn" data-mode="manual_note" type="button">Write a note</button>
        </div>

        <p class="hint" id="vault-hint">
          Recall will fetch the page, extract content, summarise it, and make it searchable.
        </p>

        <div class="note-area visible" id="vault-note-area" hidden>
          <label class="field-label" for="vault-note">Your note</label>
          <textarea id="vault-note" placeholder="Describe why you saved this link…"></textarea>
        </div>

        <button class="btn btn-primary" id="vault-save-btn">Save link</button>
      </section>

      <section class="panel" id="panel-recent" role="tabpanel">
        <div class="search-box">
          <input type="text" id="recent-search" placeholder="Search as you type…" autocomplete="off" />
        </div>
        <div class="search-status" id="recent-search-status"></div>
        <div class="suggestion-row" id="recent-suggestions"></div>
        <div class="recent-list" id="recent-list"></div>
      </section>

      <footer class="footer">
        <div class="daemon-status">
          <span class="status-dot" id="daemon-dot"></span>
          <span id="daemon-label">Checking daemon…</span>
        </div>
        <div class="footer-right">
          <a href="#" id="settings-link" class="gear-link" title="Settings">⚙</a>
          <span>
            <strong id="item-count">0</strong> items ·
            <span id="storage-used">0 B</span>
          </span>
        </div>
      </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
