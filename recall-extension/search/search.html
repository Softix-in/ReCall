<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall Search</title>
    <link rel="stylesheet" href="search.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>Recall Search</h1>
        <p>Search your saved library by meaning or keywords.</p>
      </header>

      <form class="search-bar" id="search-form">
        <input
          id="search-input"
          type="search"
          placeholder="What are you looking for?"
          autocomplete="off"
          autofocus
        />
        <button type="submit">Search</button>
      </form>

      <div class="filters">
        <select id="filter-type" aria-label="Source type">
          <option value="">All types</option>
          <option value="video">Video</option>
          <option value="article">Article</option>
          <option value="link">Link</option>
          <option value="audio">Audio</option>
        </select>

        <select id="filter-save-mode" aria-label="Save mode">
          <option value="">Any save mode</option>
          <option value="auto_scrape">Auto-scrape</option>
          <option value="manual_note">Manual note</option>
        </select>

        <select id="filter-since" aria-label="Date range">
          <option value="">Any time</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="90d">Last 90 days</option>
        </select>
      </div>

      <div class="meta" id="results-meta" hidden></div>
      <section class="results" id="results"></section>

      <details class="history-panel" id="history-panel">
        <summary>Job history (30 days)</summary>
        <div id="job-history" class="history-list">Loading…</div>
      </details>

      <footer class="footer">
        <span><span class="kbd">↑</span> <span class="kbd">↓</span> navigate · <span class="kbd">Enter</span> open · <span class="kbd">T</span> transcript</span>
        <span id="footer-status">Checking daemon…</span>
      </footer>
    </main>

    <script type="module" src="search.js"></script>
  </body>
</html>
